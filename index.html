<title>Sân chơi Will &amp; Kem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: the same sunny meadow as the games, two big game cards to tap. Single bright look on purpose. */
:root {
  --sky-top: #6fc3f0;
  --sky-low: #c9ecff;
  --hill: #7cc66b;
  --hill-dark: #4f9f48;
  --ink: #1f2d3d;
  --card: #fffdf6;
  --sun: #ffb229;
  --accent: #ff7a2f;
  --muted: #5b6b7c;
  --display: "Baloo 2", "Fredoka", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  margin: 0; color: var(--ink); font-family: var(--body); user-select: none; -webkit-user-select: none;
  background:
    radial-gradient(circle at 88% 10%, var(--sun) 0 40px, transparent 42px),
    radial-gradient(ellipse 60% 18% at 20% 104%, var(--hill-dark) 0 98%, transparent 100%),
    radial-gradient(ellipse 70% 22% at 85% 108%, var(--hill) 0 98%, transparent 100%),
    linear-gradient(var(--sky-top), var(--sky-low)) fixed;
  background-color: var(--sky-top);
  min-height: 100%;
}
main { max-width: 960px; margin: 0 auto; padding: 32px 16px 120px; display: flex; flex-direction: column; gap: 28px; }
h1 {
  font-family: var(--display); font-weight: 800; font-size: clamp(40px, 9vw, 72px); line-height: .95; margin: 0;
  color: #fff; text-shadow: 0 4px 0 rgba(31,45,61,.25); text-wrap: balance;
}
.sub { margin: 6px 0 0; font-size: clamp(17px, 2.6vw, 22px); font-weight: 800; color: var(--ink); opacity: .8; }
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
.game {
  display: flex; flex-direction: column; gap: 10px; padding: 26px 24px 24px; min-height: 260px;
  background: var(--card); color: var(--ink); text-decoration: none; border-radius: 30px;
  box-shadow: 0 10px 0 rgba(31,45,61,.18); transition: transform .12s, box-shadow .12s; position: relative; overflow: hidden;
}
.game:active { transform: translateY(6px); box-shadow: 0 4px 0 rgba(31,45,61,.18); }
.game:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }
.art { font-size: 84px; line-height: 1; }
.game h2 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5vw, 40px); margin: 0; line-height: 1; }
.game p { margin: 0; font-size: 18px; line-height: 1.4; color: var(--muted); }
.tag { align-self: flex-start; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 12px; border-radius: 999px; background: var(--tag-bg); color: var(--tag-fg); }
.play { margin-top: auto; align-self: flex-start; font-family: var(--display); font-weight: 800; font-size: 24px;
  color: #fff; background: var(--btn); padding: 8px 26px; border-radius: 999px; box-shadow: 0 4px 0 var(--btn-shadow); }
.g-num { --tag-bg: #dcecff; --tag-fg: #1f5fa8; --btn: #3a8ee6; --btn-shadow: #1f5fa8; }
.g-dino { --tag-bg: #dff3d8; --tag-fg: #2f7a2a; --btn: #2fae5b; --btn-shadow: #1f7a3e; }
.g-num h2 span { color: #3a8ee6; } .g-dino h2 span { color: #2fae5b; }
@media (prefers-reduced-motion: reduce) { .game { transition: none; } }
</style>

<main>
  <header>
    <h1>Sân chơi Will &amp; Kem</h1>
    <p class="sub">Chọn một trò chơi nhé!</p>
  </header>
  <nav class="games" aria-label="Trò chơi">
    <a class="game g-dino" href="khung-long-danh-van/">
      <span class="art" aria-hidden="true">🦖🥚</span>
      <span class="tag">Tiếng Việt · Vần</span>
      <h2>Khủng long <span>đánh vần</span></h2>
      <p>Nghe cô đánh vần "a – ngờ – ang", đưa khủng long ◀ ▶ hứng đúng quả trứng.</p>
      <span class="play">▶ Chơi</span>
    </a>
    <a class="game g-num" href="flying-numbers/">
      <span class="art" aria-hidden="true">🔢🦕</span>
      <span class="tag">English · Numbers</span>
      <h2>Flying <span>Numbers</span></h2>
      <p>Listen to the number and tap it as it flies past. Numbers 1–20.</p>
      <span class="play">▶ Play</span>
    </a>
  </nav>
</main>
